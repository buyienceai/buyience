      "@type": "Question",
      "name": "What should a rep know before a price negotiation starts?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Three numbers — the floor below which the deal is not worth doing, an opening with room to concede above it, and a walk-away point for the relationship rather than the transaction. Plus the account's pricing history, so the rep is negotiating from record rather than memory."
      }
    },
    {
      "@type": "Question",
      "name": "What can I trade instead of discounting?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Payment terms, volume or minimum-order commitments, order consolidation, longer lead times, staged delivery scheduling, product mix, and packaging or handling arrangements. Most cost less than margin, and several are easier for a buyer to concede because they come from a different budget."
      }
    },
    {
      "@type": "Question",
      "name": "How should concessions be structured?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "In decreasing increments, so the pattern signals a limit. Never concede twice without the buyer moving in return, and always attach a condition — \"I can do that with Net 30\" rather than an unconditional yes, so the trade stays visible."
      }
    },
    {
      "@type": "Question",
      "name": "How do I handle \"your competitor is cheaper\"?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Establish comparability first on specification, quantity, lead time, terms and freight, which resolves many cases without movement. If genuinely comparable and cheaper, decide against your floor and walk-away rather than matching reflexively, and prefer a conditional match to an outright one."
      }
    },
    {
      "@type": "Question",
      "name": "When is it right to lose a deal on price?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "When the price required is below your floor. A distributor who never loses on price is almost certainly conceding too readily elsewhere, and losing to a competitor pricing below your cost is a correct outcome rather than a failure."
      }
    },
    {
      "@type": "Question",
      "name": "Why does recording negotiation outcomes matter?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It answers the customer's question next quarter about why their price changed, reveals whether an account is ratcheting you down across successive orders, and gives a rep inheriting the account the relationship's history. Buyers keep records; sellers who don't negotiate at a permanent disadvantage."
      }
