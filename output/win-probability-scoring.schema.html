    {
      "@type": "Question",
      "name": "What is win-probability scoring in B2B quoting?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An estimate of how likely a given quote is to convert, based on how it compares to past quotes — discount depth relative to that customer's norm, position against the margin floor, order size versus their typical, relationship recency, revision count and category patterns."
      }
    },
    {
      "@type": "Question",
      "name": "Why are win-probability percentages often misleading?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because a percentage is a claim about frequency that requires a large sample of comparable deals to support. B2B volume per segment is usually thin, so a two-digit figure often implies precision the underlying data cannot provide, and the difference between 71% and 76% is noise rather than signal."
      }
    },
    {
      "@type": "Question",
      "name": "What does calibration mean for a win-probability model?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A model is calibrated if, across all quotes it scored at 70%, roughly 70% actually closed. Verifying that needs a large sample of scored quotes with known outcomes, segmented finely enough to be meaningful — which many B2B businesses will never reach in a given segment."
      }
    },
    {
      "@type": "Question",
      "name": "What should a scoring system show when there's no history for a customer?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The inputs rather than a score — first quote for this account, discount depth, position against the floor. Showing a confident number the system cannot stand behind is worse than showing none."
      }
    },
    {
      "@type": "Question",
      "name": "How should a sales rep use a win-probability score?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "As a prompt rather than an instruction, comparatively rather than absolutely, and always alongside margin. Comparing two versions of the same quote is more trustworthy than either score in isolation, since relative movement is more reliable than the absolute figure."
      }
    },
    {
      "@type": "Question",
      "name": "What should I ask a vendor about their win-probability feature?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "What inputs drive it, what happens with a new customer, whether a rep can see the reasoning, how it's calibrated and against what sample, and the minimum history before a score appears at all. A precise accuracy claim with no stated sample, segment or timeframe is marketing."
      }
    }
  ]
